<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <!-- #311 關於頁鈕列加「使用手冊」：置「更新紀錄」右側、同為 GhostButton、恆顯（版面示意；實機以 README 截圖為準） -->
  <rect x="0" y="0" width="520" height="230" fill="#FDF5F8"/>
  <!-- About 卡 -->
  <rect x="12" y="12" width="496" height="206" rx="8" fill="#FBFCFF" stroke="#F4C2D0" stroke-width="1"/>
  <!-- 左：logo -->
  <rect x="30" y="40" width="72" height="72" rx="10" fill="#FCE4EC" stroke="#F4C2D0"/>
  <text x="66" y="83" font-size="11" fill="#B0578D" text-anchor="middle">logo</text>
  <!-- 右：資訊欄 -->
  <text x="122" y="46" font-size="17" font-weight="600" fill="#B0578D">LingoIsland</text>
  <text x="122" y="66" font-size="12" fill="#9A6A82">版本 v4.17.0</text>
  <text x="122" y="86" font-size="11.5" fill="#9A6A82">© 2026 Carlton Chen．保留一切權利。</text>
  <text x="122" y="104" font-size="11" fill="#B0578D">GitHub</text>

  <!-- 同一列：更新區（可隱）＋更新紀錄鈕（恆顯）＋使用手冊鈕（恆顯，#311） -->
  <g>
    <text x="122" y="150" font-size="12" fill="#9A6A82">已是最新版本</text>
    <rect x="212" y="138" width="76" height="24" rx="5" fill="#FFF" stroke="#F4C2D0"/>
    <text x="250" y="154" font-size="12" fill="#B0578D" text-anchor="middle">檢查更新</text>
    <rect x="296" y="138" width="76" height="24" rx="5" fill="#FFF" stroke="#F4C2D0"/>
    <text x="334" y="154" font-size="12" fill="#B0578D" text-anchor="middle">更新紀錄</text>
    <rect x="380" y="138" width="76" height="24" rx="5" fill="#FFF" stroke="#D97CA6" stroke-width="1.5"/>
    <text x="418" y="154" font-size="12" fill="#B0578D" text-anchor="middle">使用手冊</text>
  </g>
  <text x="122" y="184" font-size="9.5" fill="#B692A6">↑ #311：「使用手冊」接在「更新紀錄」之後、恆顯；按下以預設瀏覽器開啟</text>
  <text x="122" y="200" font-size="9.5" fill="#B692A6">　 {RepoUrl}/blob/v{本機版號}/README.md；開不起來則跳提示（附網址）</text>
</svg>
